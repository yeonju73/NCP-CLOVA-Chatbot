<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="우리FISA NCP CLOVA Chatbot 프로젝트입니다."
    />
    <title>WOORI_FISA_CHATBOT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.min.css"/>
    <link rel="stylesheet" href="style.css">
    <script defer type="module" src="app.js"></script>
    </head>
<body>
    <div class="modal">
        <div class="modal-window">
            <div class="modal-top">
                <h3>대화를 다시 시작하시겠습니까?</h3>
            </div>
            <div class="modal-under">
                <button class="modal-button" id="yes-button">예</button>
                <button class="modal-button" id="no-button">아니오</button>
            </div>
        </div>
    </div>
    <!-- 헤더 부분 -->
    <header>
        <div>
            <button id="themeToggle" class="theme-toggle" aria-label="다크모드 토글">
                <i class="fas fa-sun sun"></i>
                <i class="fas fa-moon moon"></i>
            </button>
        </div>
        <h3 class="chat-title">우리FIS 아카데미 상담 챗봇</h3>
        <div class="header-icons">
            <button class="close-button" aria-label="채팅창 닫기 버튼"><i class="fas fa-times close-icon"></i></button>
        </div>
    </header>
    <!-- 채팅 출력 위치 -->
    <main class="chatgroup">
        <div class="chat-div chat-div-center">
            <div id="chatDate" class="chat-date"></div>
        </div>
        <div class="chat-div chat-div-left">
            <div class="bot-message-wrapper">
                <div class="ballon chatbot-ballon">
                    안녕하세요! 우리FISA 챗봇입니다.<br>무엇을 도와드릴까요?
                </div>
                <button class="copy-btn" aria-label="복사">
                    <i class="far fa-copy"></i>
                </button>
            </div>
        </div>
    </main>
    <!-- 채팅 입력 위치 -->
    <div class="chatinput">
        <div class="chat-inputfield">
            <textarea id="send-message" aria-label="메시지 입력"></textarea>
            <button class="send-button" aria-label="전송 버튼"><i class="fas fa-paper-plane"></i></button>
            <!-- 채팅 입력 후 응답 오기 전 까지 비활성화 버튼 -->
            <button disabled class="send-button send-button-hidden" id="disabled-send-button"><i class="far fa-stop-circle"></i></button>
        </div>
    </div>
    <button id="scrollBottomBtn" class="scroll-bottom-btn" aria-label="스크롤 버튼">
        <i class="fas fa-arrow-down"></i>
    </button>
</body>
</html>
