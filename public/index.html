<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOORI_FISA_CHATBOT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.min.css"/>
    <link rel="stylesheet" href="style.css">
    <script defer type="module" src="app.js"></script>
    </head>
<body>
    <!-- 헤더 부분 -->
    <header>
        <div>
            <button id="themeToggle" class="theme-toggle" aria-label="다크모드 토글">
                <i class="fas fa-sun sun"></i>
                <i class="fas fa-moon moon"></i>
            </button>
        </div>
        <h3 class="chat-title">우리FIS 아카데미 상담 챗봇</h3>
        <div class="header-icons">
            <button class="close-button"><i class="fas fa-times close-icon"></i></button>
        </div>
        
        
    </header>
    <!-- 채팅 출력 위치 -->
    <div class="chatgroup">
        <div class="chat-div chat-div-center">
            <div id="chatDate" class="chat-date"></div>
        </div>
        <div class="chat-div chat-div-left">
            <div class="ballon chatbot-ballon">
                안녕하세요.
            </div>
        </div>
        <div class="chat-div chat-div-right">
            <div class="ballon user-ballon">
                반갑습니다.
            </div>
        </div>
        <div class="chat-div chat-div-right">
            <div class="ballon user-ballon">
                반갑습니다.
            </div>
        </div>
        <div class="chat-div chat-div-right">
            <div class="ballon user-ballon">
                반갑습니다.
            </div>
        </div>
        <div class="chat-div chat-div-right">
            <div class="ballon user-ballon">
                반갑습니다.
            </div>
        </div>
        <!-- <div class="chat-div chat-div-left">
            <div class="ballon chatbot-ballon chatbot-ballon-wait">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div> -->
    </div>
    <!-- 채팅 입력 위치 -->
    <div class="chatinput">
        <div class="chat-inputfield">
            <textarea id="send-message"></textarea>
            <button class="send-button"><i class="fas fa-paper-plane"></i></button>
            <!-- 채팅 입력 후 응답 오기 전 까지 비활성화 버튼 -->
            <button disabled class="send-button send-button-hidden"><i class="far fa-stop-circle"></i></button>
        </div>
    </div>
    <button id="scrollBottomBtn" class="scroll-bottom-btn">
        <i class="fas fa-arrow-down"></i>
    </button>
</body>
</html>
